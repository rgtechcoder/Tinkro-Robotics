<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tinkro – Components Catalog & Order Form</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--teal:#0A8A8A;--dark:#0C2D48;--navy:#0F3460;--accent:#00D4AA;--light:#E8F8F5;--bg:#F0F7F7;--card:#fff;--t1:#1A2B3C;--t2:#5A6B7C;--border:#D4E5E5;--r:14px;--rs:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.header{background:linear-gradient(135deg,var(--dark),var(--navy) 40%,var(--teal));position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;flex-wrap:wrap;gap:16px}
.logo-area{display:flex;align-items:center;gap:14px}
.logo-icon{width:48px;height:48px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.logo-text{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#fff;letter-spacing:2px}
.logo-sub{font-size:11px;color:var(--accent);letter-spacing:3px;text-transform:uppercase;font-weight:600}
.header-title{font-family:'Space Grotesk',sans-serif;font-size:16px;color:rgba(255,255,255,.85);text-align:right}
.header-title span{display:block;font-size:22px;font-weight:700;color:#fff;letter-spacing:1px}
.controls-bar{background:rgba(255,255,255,.07);padding:14px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1)}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:12px 18px 12px 44px;border:2px solid rgba(255,255,255,.2);border-radius:10px;font-size:15px;font-family:inherit;background:rgba(255,255,255,.12);color:#fff;outline:none}
.search-box input::placeholder{color:rgba(255,255,255,.5)}
.search-box input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6}
.cart-badge{background:var(--accent);color:var(--dark);padding:10px 20px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;border:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.cart-badge:hover{transform:scale(1.05)}
.category-bar{padding:18px 32px 12px;display:flex;gap:8px;flex-wrap:wrap}
.cat-pill{padding:8px 18px;border-radius:100px;border:2px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;white-space:nowrap}
.cat-pill:hover{border-color:var(--teal);color:var(--teal)}
.cat-pill.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.main{padding:8px 32px 120px}
.section-header{display:flex;align-items:center;gap:10px;margin:28px 0 16px;padding-bottom:10px;border-bottom:2px solid var(--teal)}
.section-header .emoji{font-size:24px}
.section-header h2{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--dark)}
.section-header .count{margin-left:auto;font-size:13px;color:var(--t2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.results-count{padding:12px 0;font-size:14px;color:var(--t2)} .results-count strong{color:var(--teal)}
.card{background:var(--card);border-radius:var(--r);border:2px solid var(--border);overflow:hidden;transition:all .25s;display:flex;flex-direction:column}
.card:hover{border-color:var(--teal);box-shadow:0 8px 32px rgba(10,138,138,.15);transform:translateY(-3px)}
.card.in-cart{border-color:var(--accent)} .card.in-cart .card-img-wrap{background:linear-gradient(135deg,#E0FFF6,#D0F5EE)}
.card-img-wrap{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#F0F7F7,#E4EFEF);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-img-wrap img{width:100%;height:100%;object-fit:contain;padding:12px;transition:transform .3s}
.card:hover .card-img-wrap img{transform:scale(1.08)}
.card-img-fallback{font-size:56px;opacity:.6}
.card-sku-badge{position:absolute;top:8px;left:8px;background:var(--dark);color:var(--accent);padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;font-family:'Space Grotesk',monospace;z-index:2}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.card-name{font-weight:700;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;margin-bottom:auto}
.card-bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.qty-label{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px}
.qty-control{display:flex;align-items:center;border:2px solid var(--border);border-radius:var(--rs);overflow:hidden}
.card.in-cart .qty-control{border-color:var(--accent)}
.qty-btn{width:32px;height:32px;border:none;background:var(--bg);font-size:17px;font-weight:700;color:var(--teal);cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-btn:hover{background:var(--teal);color:#fff}
.qty-input{width:40px;height:32px;text-align:center;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);font-size:15px;font-weight:700;font-family:'Space Grotesk',monospace;outline:none}
.qty-input::-webkit-inner-spin-button{-webkit-appearance:none}
.order-overlay{position:fixed;inset:0;background:rgba(12,45,72,.5);z-index:200;display:none;opacity:0;transition:opacity .3s}
.order-overlay.open{display:block;opacity:1}
.order-panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,92vw);background:#fff;z-index:201;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 40px rgba(0,0,0,.15)}
.order-panel.open{transform:translateX(0)}
.panel-header{padding:20px 24px;background:linear-gradient(135deg,var(--dark),var(--teal));color:#fff;display:flex;align-items:center;justify-content:space-between}
.panel-header h2{font-family:'Space Grotesk',sans-serif;font-size:20px}
.close-btn{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel-body{flex:1;overflow-y:auto;padding:20px 24px}
.order-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.oi-thumb{width:44px;height:44px;border-radius:8px;background:var(--light);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.oi-thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
.oi-info{flex:1} .oi-name{font-weight:600;font-size:14px} .oi-sku{font-size:12px;color:var(--teal);font-family:'Space Grotesk',monospace}
.oi-qty{font-family:'Space Grotesk',monospace;font-weight:700;font-size:16px;color:var(--dark);min-width:40px;text-align:center}
.oi-remove{width:28px;height:28px;border-radius:50%;border:none;background:#FFE8E8;color:#E74C3C;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.oi-remove:hover{background:#E74C3C;color:#fff}
.empty-cart{text-align:center;padding:60px 20px;color:var(--t2)}
.order-total{padding:14px 0;text-align:right;font-weight:700;color:var(--dark);font-size:15px;border-top:2px solid var(--teal);margin-top:8px}
.order-form{padding:20px 24px;border-top:2px solid var(--teal);background:var(--light);flex-shrink:0}
.form-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--dark);margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-field input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:inherit;outline:none;background:#fff}
.form-field input:focus{border-color:var(--teal)}
.form-field label{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px;display:block}
.submit-row{display:flex;gap:10px;margin-top:14px}
.btn-wa{flex:1;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-wa:hover{filter:brightness(1.1)}
.btn-copy{padding:14px 20px;background:var(--dark);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.footer-strip{position:fixed;bottom:0;left:0;right:0;background:var(--dark);color:rgba(255,255,255,.7);text-align:center;padding:10px;font-size:13px;z-index:50}
.footer-strip span{color:var(--accent);font-weight:700}
.no-results{text-align:center;padding:60px 20px;color:var(--t2);grid-column:1/-1}
@media(max-width:640px){.header-top{padding:14px 16px}.controls-bar{padding:10px 16px}.category-bar{padding:12px 16px 8px}.main{padding:4px 16px 100px}.logo-text{font-size:22px}.header-title{display:none}.grid{grid-template-columns:1fr 1fr;gap:10px}.card-img-wrap{aspect-ratio:1}.card-body{padding:10px 10px 12px}.card-name{font-size:12px;min-height:32px}.form-row{grid-template-columns:1fr}.qty-label{display:none}}
</style></head><body>
<div class="header"><div class="header-top"><div class="logo-area"><div class="logo-icon">🤖</div><div><div class="logo-text">TINKRO</div><div class="logo-sub">Build · Code · Innovate</div></div></div><div class="header-title">Components Catalog<span>& Order Form</span></div></div><div class="controls-bar"><div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="Search by name or SKU..." oninput="filterProducts()"></div><button class="cart-badge" onclick="togglePanel()">🛒 Order: <span id="cartCount">0</span> items</button></div></div>

<div class="main" id="mainGrid"></div>
<div class="footer-strip">Thank you for choosing <span>Tinkro</span> – Empowering Young Innovators! &nbsp;|&nbsp; 📞 +91 96445 25429 &nbsp;|&nbsp; 📧 tinkrokits@gmail.com &nbsp;|&nbsp; 🌐 www.tinkro.in</div>

,"name":"ESP32-S3 Development Board - Dual-Core WiFi + BLE","cat":"Microcontrollers & Development Boards","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2FrS4RV1Zuq8SKUCAhYa3U%2F1787461010161_esp-32-s3-tinkro.png?alt=media&token=0d12e0d9-a648-4a21-af2c-44983211b1ea"},{"sku":"TKR-1074","name":"DHT22 Temperature and Humidity Sensor Module","cat":"STEM Products","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2FsX6j0a1wkXiViwbO5Azn%2F1787460611975_dht22-humidity-sensor-tinkro.png?alt=media&token=9865164d-62e0-4e9c-93c7-d79688fca0c5"},{"sku":"TKR-1128","name":"HR202 Humidity Sensor Module with PCB","cat":"STEM Products","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2Ft3fUKFiMjdes6W9p3oZQ%2F1789064336548_h202.jpg?alt=media&token=e076c063-9eb5-441c-bf76-20ac7b51897f"},{"sku":"TKR-004","name":"USB Programming Cable for Arduino UNO","cat":"Microcontrollers & Development Boards","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2Fcc13a98f-9a81-45e1-b600-5f17dfdbdb28%2F1776000514342_Screenshot%202026-04-12%20185801.jpg?alt=media&token=c28177f2-b3d1-4cc4-a0d1-467eca8e0381"},{"sku":"TKR-1056","name":"QTR-8RC Reflectance Sensor Array - 8-Channel Line Following Module","cat":"STEM Products","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2FvpYry0lC67nfuRYbTmIu%2F1787462760492_qtr-line-foloower-tinkro.png?alt=media&token=8c2b22cf-8180-4f99-9fe9-ec527fa9535f"},{"sku":"TKR-1066","name":"Illuminated Round Rocker Switch - 6A 250V (Red)","cat":"STEM Products","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2Fvzp1qtEGLk722OUgFoo0%2F1787503756512_illuminated-round-rocker-switch-6a-250v-red-tinkro.png?alt=media&token=5c7e2fae-7411-415a-a8ac-2159047e4530"},{"sku":"TKR-1071","name":"Female DC Power Supply Connector / Barrel DC Jack","cat":"STEM Products","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2FwGm8oITgE74swC8XfKpT%2F1787461157010_femal-dc-jack-tinkro.png?alt=media&token=6b9ff948-7540-4b9c-92c5-aa896b8563c7"},{"sku":"TKR-007","name":"Ultrasonic Sensor (HC-SR04)","cat":"Sensors & Modules","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2F5fdb3838-0b24-467e-85a1-dbb14529c431%2F1776448923803_ULTRASONIC%20(1).PNG?alt=media&token=745401f3-e4bd-4697-9485-160d5f72e47f"},{"sku":"TKR-1048","name":"Water Level Sensor Module","cat":"STEM Products","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2Fx92FDP2qe0fYDGk7PIWS%2F1787464291065_water-sensor.png?alt=media&token=821a4fdd-9fd8-4f07-a2fa-226c81d80192"},{"sku":"TKR-056","name":"9V Battery Connector Clip","cat":"Power Supply & Batteries (very useful additio","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2F22fd1ccc-42d1-4e45-b552-c9f1800f345d%2F1776276856767_images%20(14).jpg?alt=media&token=969c6313-6abe-435c-bc9f-7816f11de366"},{"sku":"TKR-207","name":"SG90 Micro Servo Motor (Pack of 2)","cat":"Motors, Drivers & Actuators","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2FyzdCElExegwlp4v8qR17%2F1785866148326_servo-motor-pack-of-2-tinkro.png?alt=media&token=437ab1b3-26b3-4092-85b3-f5ecf462cd7f"},{"sku":"TKR-1125","name":"Water Flow Sensor YF-S201 Hall Effect 1-30 L/min","cat":"STEM Products","icon":"📦","img":"https://firebasestorage.googleapis.com/v0/b/tinkro-robotics.firebasestorage.app/o/products%2FzuyKGZx9zwMQHPsSIm4Y%2F1789063309656_water-flow-sensor.jpg?alt=media&token=eacd07aa-6ee0-4c72-960a-3cb77db36ce9"}];
const cart={};let activeCat="All";
const catIcons={"Microcontrollers & Boards":"🔲","Motors & Actuators":"⚙️","Motor Drivers":"🎛️","Sensors":"📡","Displays":"📟","LEDs & Indicators":"💡","Power & Batteries":"🔋","Connectivity":"📶","Switches & Relays":"🔘","Wires & Connectors":"🔗","Prototyping":"🧩","Wheels & Chassis":"🛞","DIY Kits":"🚗","Tools & Accessories":"🔧"};
function getCategories(){return["All",...new Set(products.map(p=>p.cat))];}
function renderCategoryBar(){document.getElementById('categoryBar').innerHTML=getCategories().map(c=>`<button class="cat-pill ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c==='All'?'🏷️ All':c}</button>`).join('');}
function setCat(c){activeCat=c;renderCategoryBar();filterProducts();}
function filterProducts(){const q=document.getElementById('searchInput').value.toLowerCase().trim();let f=products;if(activeCat!=='All')f=f.filter(p=>p.cat===activeCat);if(q)f=f.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q));renderGrid(f);}
function renderGrid(items){const m=document.getElementById('mainGrid');if(!items.length){m.innerHTML='<div class="no-results"><div style="font-size:48px">🔍</div><p>No components found.</p></div>';return;}const g={};items.forEach(p=>{if(!g[p.cat])g[p.cat]=[];g[p.cat].push(p);});let h='<div class="results-count">Showing <strong>'+items.length+'</strong> components</div>';for(const cat of Object.keys(g)){const ps=g[cat];h+=`<div class="section-header"><span class="emoji">${catIcons[cat]||'📦'}</span><h2>${cat}</h2><span class="count">${ps.length} items</span></div><div class="grid">`;ps.forEach(p=>{const q=cart[p.sku]||0;const hasImg=p.img&&p.img.length>0;let ia;if(hasImg){ia=`<div class="card-img-wrap"><span class="card-sku-badge">${p.sku}</span><img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="card-img-fallback" style="display:none;position:absolute;width:100%;height:100%">${p.icon}</span></div>`;}else{ia=`<div class="card-img-wrap"><span class="card-sku-badge">${p.sku}</span><span class="card-img-fallback" style="width:100%;height:100%">${p.icon}</span></div>`;}h+=`<div class="card ${q>0?'in-cart':''}" id="card-${p.sku}">${ia}<div class="card-body"><div class="card-name">${p.name}</div><div class="card-bottom-row"><span class="qty-label">QTY</span><div class="qty-control"><button class="qty-btn" onclick="changeQty('${p.sku}',-1)">−</button><input class="qty-input" type="number" min="0" value="${q}" id="qty-${p.sku}" onchange="setQty('${p.sku}',this.value)"><button class="qty-btn" onclick="changeQty('${p.sku}',1)">+</button></div></div></div></div>`;});h+='</div>';}m.innerHTML=h;}
function changeQty(s,d){const n=Math.max(0,(cart[s]||0)+d);if(n===0)delete cart[s];else cart[s]=n;const i=document.getElementById('qty-'+s);if(i)i.value=n;const c=document.getElementById('card-'+s);if(c)c.classList.toggle('in-cart',n>0);updateCartBadge();}
function setQty(s,v){const n=Math.max(0,parseInt(v)||0);if(n===0)delete cart[s];else cart[s]=n;const c=document.getElementById('card-'+s);if(c)c.classList.toggle('in-cart',n>0);updateCartBadge();}
function updateCartBadge(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0);}
function togglePanel(){const o=document.getElementById('orderOverlay'),p=document.getElementById('orderPanel');if(p.classList.contains('open')){p.classList.remove('open');o.classList.remove('open');}else{renderPanel();p.classList.add('open');o.classList.add('open');}}
function renderPanel(){const b=document.getElementById('panelBody'),sk=Object.keys(cart);if(!sk.length){b.innerHTML='<div class="empty-cart"><div style="font-size:48px">📦</div><p>No items added yet. Tap <b>+</b> to add.</p></div>';document.getElementById('orderForm').style.display='none';return;}document.getElementById('orderForm').style.display='block';let h='',tu=0;sk.forEach(s=>{const p=products.find(x=>x.sku===s);if(!p)return;const q=cart[s];tu+=q;const th=p.img?`<img src="${p.img}">`:`<span style="font-size:22px">${p.icon}</span>`;h+=`<div class="order-item"><div class="oi-thumb">${th}</div><div class="oi-info"><div class="oi-name">${p.name}</div><div class="oi-sku">${p.sku}</div></div><span class="oi-qty">×${q}</span><button class="oi-remove" onclick="removeItem('${s}')">✕</button></div>`;});h+=`<div class="order-total">📦 ${sk.length} products · ${tu} units</div>`;b.innerHTML=h;}
function removeItem(s){delete cart[s];const i=document.getElementById('qty-'+s);if(i)i.value=0;const c=document.getElementById('card-'+s);if(c)c.classList.remove('in-cart');updateCartBadge();renderPanel();}
function buildOrderText(){const sc=document.getElementById('schoolName').value||'—',co=document.getElementById('contactPerson').value||'—',mo=document.getElementById('mobileNo').value||'—',dt=document.getElementById('orderDate').value||new Date().toLocaleDateString('en-IN'),sk=Object.keys(cart);let t='📋 *TINKRO — ORDER FORM*\n━━━━━━━━━━━━━━━━━━\n🏫 School: '+sc+'\n👤 Contact: '+co+'\n📱 Mobile: '+mo+'\n📅 Date: '+dt+'\n━━━━━━━━━━━━━━━━━━\n\n*ITEMS ORDERED:*\n\n';let tu=0;sk.forEach((s,i)=>{const p=products.find(x=>x.sku===s);if(!p)return;const q=cart[s];tu+=q;t+=(i+1)+'. '+p.name+'\n   SKU: '+s+'  |  Qty: '+q+'\n\n';});t+='━━━━━━━━━━━━━━━━━━\n📦 Total Products: '+sk.length+'\n📦 Total Units: '+tu+'\n━━━━━━━━━━━━━━━━━━\n\n🌐 www.tinkro.in\n📧 tinkrokits@gmail.com';return t;}
function sendWhatsApp(){window.open('https://wa.me/919644525429?text='+encodeURIComponent(buildOrderText()),'_blank');}
function copyOrder(){navigator.clipboard.writeText(buildOrderText()).then(()=>{const b=document.querySelector('.btn-copy');b.textContent='✅ Copied!';setTimeout(()=>b.textContent='📋 Copy',2000);});}
document.getElementById('orderDate').valueAsDate=new Date();renderCategoryBar();filterProducts();
</script></body></html>
